<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker - Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .loading-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 30px 24px;
      text-align: center;
    }

    .brand {
      margin-bottom: 16px;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .spinner-wrap {
      display: grid;
      place-items: center;
      margin: 20px 0 16px;
    }

    .spinner {
      width: 54px;
      height: 54px;
      border: 5px solid #dbeafe;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .status {
      color: #1d4ed8;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }

    .small {
      color: var(--muted);
      font-size: 0.83rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 420px) {
      .loading-card {
        padding: 24px 16px;
      }

      .brand h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <section class="loading-card" aria-live="polite">
    <div class="brand">
      <h1>Welcome</h1>
      <p>Your Personal Finance Dashboard</p>
    </div>

    <div class="spinner-wrap">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>

    <p class="status">Preparing your dashboard...</p>
    <p class="small">Your data is being loaded</p>
  </section>

  <script>
    (function () {
      const API_URL = "https://fintrack-ry01.onrender.com";
      const STORAGE_KEY = "financeTrackerEntries";
      const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
      const currentUser = localStorage.getItem("username") || "";

      if (!isLoggedIn || !currentUser) {
        window.location.href = "index.html";
        return;
      }

      async function preloadEntries() {
        try {
          const response = await fetch(
            API_URL + "/api/entries?user_id=" + encodeURIComponent(currentUser),
            {
              method: "GET",
              headers: { "x-user-id": currentUser }
            }
          );

          if (!response.ok) throw new Error("Server error");

          const data = await response.json();
          const preloaded = (data.entries || []).map(item => ({
            ...item,
            amount: Number(item.amount) || 0
          }));

          sessionStorage.setItem("preloadedEntries", JSON.stringify(preloaded));
          sessionStorage.setItem("preloadedEntriesSource", "backend");
        } catch (error) {
          const allEntries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          const localUserEntries = allEntries
            .filter(e => e.user_id === currentUser)
            .map(item => ({
              ...item,
              amount: Number(item.amount) || 0
            }));

          sessionStorage.setItem("preloadedEntries", JSON.stringify(localUserEntries));
          sessionStorage.setItem("preloadedEntriesSource", "local");
        } finally {
          window.location.href = "dashboard.html";
        }
      }

      preloadEntries();
    })();
  </script>
</body>
</html>
